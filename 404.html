<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Joaquin Sampallo</title>
<meta name="robots" content="noindex">
<script>
// GitHub Pages serves this page for any address that doesn't exist.
// Old addresses forward to where the page lives now and keep the visitor's #section. Everything else sees the message below
(function () {
  var moved = {
    '/acas.html': '/studies/acas/',
    '/kd.html': '/studies/kd/',
    '/landing.html': '/',
    '/landing': '/',
    '/qata.html': '/studies/qata/',
    '/qata': '/studies/qata/',
    '/visuals.html': '/visuals/',
    '/studies/db': '/studies/pareto/'
  };
  var path = location.pathname.replace(/(\/index\.html|\/)$/, '');
  if (moved[path]) {
    document.documentElement.style.visibility = 'hidden';
    location.replace(moved[path] + location.hash);
    return;
  }
  // Same language rule as the home page, and anything under /es/ stays in Spanish
  var saved; try { saved = localStorage.getItem('lang'); } catch (e) {}
  var langs = navigator.languages || [navigator.language];
  var first = langs.filter(function (l) { return /^(en|es)/i.test(l); })[0] || 'en';
  if (/^\/es(\/|$)/.test(path) || (saved || first).slice(0, 2).toLowerCase() === 'es') {
    document.documentElement.lang = 'es-AR';
    document.title = 'Página no encontrada | Joaquin Sampallo';
  }
})();
</script>

</style>

<main class="hero wrap">
  <p class="lab">404</p>
  <div class="hero-b">

      <p class="lede">It may have moved. All my work is on the home page.</p>
      <a href="/" class="nf-link">← All work</a>
    </div>
    <div class="es">

      <a href="/es/" class="nf-link">← Todo el trabajo</a>
    </div>
  </div>
</main>
