<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qata Cover</title>
<meta name="robots" content="noindex">
<script>if (/[?&]lang=es/.test(location.search)) document.documentElement.lang = 'es';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* The case study's hero demo, alone, for the home page cover (shown in an iframe on a grey stage).
   Runs the same main.js, so it stays in sync with the case study. */
html, body { background: transparent; overflow: hidden; }
@media (min-width: 1000px) { .ph { --k: .8; } }
/* Three phones stay side by side until the frame is too narrow for them */
@media (min-width: 761px) and (max-width: 1080px) {
  .demo-tabs { display: none; }
  .pane { display: block; }
  .pane-lab { justify-content: flex-start; margin-left: 4px; }
}
@media (min-width: 761px) and (max-width: 999px) {
  .panes { gap: 24px; }
  .ph { --k: .6; }
}
</style>
</head>
<body>
<div class="demo auto" id="hero-demo"></div>
<script src="main.js"></script>
</body>
</html>
